name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testy jednostkowe
        run: npm test
      - name: Build (typecheck + bundle)
        run: npm run build
      - name: Testy E2E
        run: |
          npx playwright install --with-deps chromium
          CHROMIUM_PATH= npx playwright test
